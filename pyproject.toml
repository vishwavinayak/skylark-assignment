[project]
name = "skylark-bi-agent"
version = "0.1.0"
description = "Monday.com Business Intelligence Agent for Skylark Drones"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Agent framework
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    # LLM
    "google-generativeai>=0.7.0",
    # Monday.com (GraphQL fallback)
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    # Data
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    # UI
    "streamlit>=1.35.0",
    "nest-asyncio>=1.6.0",
    # Config
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
# uv-specific settings
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
