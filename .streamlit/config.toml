# Streamlit app entry point
# Required by Streamlit Community Cloud — the main file must be at the repo root
# or configured in .streamlit/config.toml

[server]
headless = true
port = 8501

[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0f1117"
secondaryBackgroundColor = "#1a1d27"
textColor = "#e2e8f0"
font = "sans serif"
